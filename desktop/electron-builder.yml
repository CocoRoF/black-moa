appId: com.blackmoa.desktop
# 설치 경로는 productName 에서 나온다. 다른 패키지가 같은 /opt 를 가지면 dpkg 가
# 설치를 거부하므로, 흔한 이름을 피해 이 앱만의 이름을 쓴다.
productName: black-moa
copyright: Apache-2.0

# 어떤 운영체제든 한 가지 규칙으로 읽히게 한다: black-moa_<os>_<버전>.<확장자>
# 기본값에 맡기면 설치본마다 이름 짓는 방식이 달라진다.
artifactName: black-moa_${os}_${version}.${ext}
directories:
  output: release
  buildResources: build

files:
  - out/**
  - package.json
  - '!node_modules/**'

extraResources:
  # 트레이는 제 그림이 따로 있어야 한다. 설치 아이콘은 16px 에서 뭉개진다.
  - from: build/tray.png
    to: tray.png
  - from: build/tray@2x.png
    to: tray@2x.png

asar: true
compression: normal

mac:
  category: public.app-category.productivity
  # Apple 칩과 Intel 을 한 파일(universal)에 담는다. 칩마다 파일이 따로 있으면 받는 사람이 무엇을 골라야 할지
  # 헤맨다(plan/64). 이름에는 universal 이 들어간다.
  artifactName: black-moa_macos_${arch}_${version}.${ext}
  target:
    - target: dmg
      arch: [universal]
  # 서명하지 않는다. 처음 열 때 오른쪽 클릭 후 [열기] 를 한 번 하면 된다.
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false
  # 마이크를 쓰는 앱은 쓰는 이유를 적어야 한다. 안 적으면 macOS 가 그냥 막는다.
  extendInfo:
    NSMicrophoneUsageDescription: 비서에게 말로 물어보려면 마이크가 필요해요.

win:
  artifactName: black-moa_windows_${version}.${ext}
  target:
    - target: nsis
      arch: [x64]
  signAndEditExecutable: true

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  # 지우고 다시 깔았다고 로그인까지 풀릴 이유는 없다.
  deleteAppDataOnUninstall: false

linux:
  artifactName: black-moa_linux_${version}.${ext}
  # 설치 프로그램(.deb) 하나만. AppImage 는 설치 프로그램이 아니고, 둘을 함께 내놓으면 받는 사람이 헤맨다(plan/64).
  target:
    - target: deb
      arch: [x64]
  category: Network
  # 파일 하나가 아니라 폴더를 준다. 하나만 주면 24px 패널이 1024px 그림을
  # 그릴 때마다 줄인다.
  icon: build/icons
  # 이게 없으면 실행 중인 창이 .desktop 항목과 이어지지 않아 독에 기본 아이콘이 뜬다.
  syncDesktopName: true
  synopsis: 내 비서가 늘 곁에 있는 앱
  desktop:
    entry:
      Name: black-moa
      Categories: Network;Utility;
      StartupWMClass: black-moa

deb:
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libsecret-1-0

publish:
  provider: github
  owner: CocoRoF
  repo: black-moa
  releaseType: release
