# Local development helpers: only postgres (backend/frontend run on the host with hot reload)
name: blackmoa-dev
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: blackmoa-dev-pg
    environment:
      POSTGRES_DB: blackmoa
      POSTGRES_USER: blackmoa
      POSTGRES_PASSWORD: blackmoa
    ports: ["127.0.0.1:55432:5432"]
    volumes: [blackmoa-dev-pgdata:/var/lib/postgresql/data]
volumes:
  blackmoa-dev-pgdata:
