# black-moa single entrypoint. TLS terminates at Cloudflare; this listens on :80 behind the tunnel.
map $http_upgrade $connection_upgrade { default upgrade; '' close; }
map $http_x_forwarded_proto $edge_proto { default $http_x_forwarded_proto; '' $scheme; }

resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;
    client_max_body_size 4m;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "microphone=(self), camera=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://challenges.cloudflare.com https://static.cloudflareinsights.com https://apis.google.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: blob: https:; media-src 'self' blob: data:; font-src 'self' data: https://cdn.jsdelivr.net; connect-src 'self' https://challenges.cloudflare.com https://cloudflareinsights.com; frame-src 'self' https://challenges.cloudflare.com https://docs.google.com https://drive.google.com; worker-src 'self' blob:; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

    set $backend http://backend:8000;
    set $frontend http://frontend:3000;

    # Internal MCP is reachable only from backend/worker Docker networking. Never
    # expose the bridge token validation surface through Cloudflare/nginx.
    location ^~ /api/internal/mcp/ {
        return 404;
    }

    # Large-body API routes only (uploads, knowledge files, speech).
    # 28m, not 64m: the application's own ceiling is 25MB and it refuses anything larger,
    # so a 64MB body was carried across the network and buffered only to be rejected. The
    # margin covers multipart framing.
    location ~ ^/api/(uploads|knowledge/documents|knowledge/faqs/import|network/import|agents/[^/]+/stt|public/conversations/[^/]+/stt)(/|$) {
        client_max_body_size 28m;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $edge_proto;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
    }
    location /api/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $edge_proto;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        gzip off;
        chunked_transfer_encoding on;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_pass_header X-Accel-Buffering;
    }
    location ^~ /health {
        proxy_pass $backend;
        proxy_set_header Host $host;
    }
    location /static/ {
        proxy_pass $backend;
        proxy_set_header Host $host;
        expires 1h;
    }
    location /_next/static/ {
        proxy_pass $frontend;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location ~ ^/(brand|icons)/ {
        proxy_pass $frontend;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }
    # The public chat is the one page meant to live inside somebody else's site (plan/41 M6,
    # embed.js), so it is the one page any origin may frame. Everything else keeps
    # frame-ancestors 'self'. nginx does not inherit add_header into a location that has its
    # own, so the whole set is repeated here on purpose.
    location ^~ /secretary/ {
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "microphone=(self), camera=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://challenges.cloudflare.com https://static.cloudflareinsights.com https://apis.google.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: blob: https:; media-src 'self' blob: data:; font-src 'self' data: https://cdn.jsdelivr.net; connect-src 'self' https://challenges.cloudflare.com https://cloudflareinsights.com; frame-src 'self' https://challenges.cloudflare.com https://docs.google.com https://drive.google.com; worker-src 'self' blob:; base-uri 'self'; form-action 'self'; frame-ancestors *" always;
        proxy_pass $frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $edge_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass $frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $edge_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
    }
}
