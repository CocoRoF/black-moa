[project]
name = "blackmoa"
version = "0.1.0"
description = "black-moa backend"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.35",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "pgvector>=0.3.6",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "argon2-cffi>=23.1",
  "pyjwt>=2.9",
  "cryptography>=43",
  "httpx>=0.27",
  "structlog>=24",
  "python-multipart>=0.0.12",
  "jinja2>=3.1",
  "geny-executor==2.65.6",
  "geny-memory-adaptor==1.11.1",
  "numpy>=1.26",
  "tiktoken>=0.8",
  "pypdf>=5",
  "python-docx>=1.1",
  "python-pptx>=1.0",
  "openpyxl>=3.1",
  "beautifulsoup4>=4.12",
  "readability-lxml>=0.8",
  "lxml>=5",
  "uuid7>=0.1",
  "pillow>=10",
  "pillow-heif>=0.18",
  "pypdfium2>=4.30",
  "qrcode>=8",
  "aiosmtplib>=3",
  "email-validator>=2",
  "pyyaml>=6",
  "mcp>=1.0,<3",
  "python-magic>=0.4",
  # 한국의 공휴일·대체공휴일·선거일(법 개정을 따라 판이 올라온다), 음력, 24절기 (plan/60)
  "holidays>=0.105",
  "korean-lunar-calendar>=0.3.1",
  "ephem>=4.1.6",
]
[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "mypy>=1.10", "aiosqlite>=0.20"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/blackmoa"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
[tool.ruff]
line-length = 110
target-version = "py312"
[tool.ruff.lint]
select = ["E","F","I","B","UP"]
ignore = ["E501","B008"]
